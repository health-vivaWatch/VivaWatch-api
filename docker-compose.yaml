version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vivawatch-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vivawatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vivawatch}
      POSTGRES_DB: ${POSTGRES_DB:-vivawatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vivawatch-network

  redis:
    image: redis:7-alpine
    container_name: vivawatch-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - vivawatch-network

volumes:
  postgres_data:
  redis_data:

networks:
  vivawatch-network:
    driver: bridge
